edition: 1.0.0

name: yanjian
access: default

services:
  web:
    component: fc
    props:
      region: cn-hangzhou
      service:
        name: yanjian-service
      function:
        name: next-fn
        description: Next.js App
        runtime: nodejs18
        timeout: 60
        memorySize: 1024
        codeUri: ./
        handler: index.handler
        initializationTimeout: 60
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
      customRuntimeConfig:
        command:
          - bash
        args:
          - start.sh
