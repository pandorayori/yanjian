edition: 1.0.0

name: yanjian
access: default

services:
  web:
    component: fc
    props:
      region: cn-hangzhou
      service:
        name: yanjian-service
      function:
        name: next-fn
        description: Next.js App
        runtime: custom.debian10
        codeUri: ./
        memorySize: 1024
        timeout: 60
        initializationTimeout: 60
        handler: index.handler

        # 🟢 构建步骤（非常关键）
        build:
          commands:
            - npm install
            - npm run build

        # 🟢 运行环境（custom runtime）
        customRuntimeConfig:
          command:
            - bash
          args:
            - start.sh

      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
