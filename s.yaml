edition: 1.0.0
name: yanjian
access: default

vars:
  region: cn-hangzhou

services:
  web:
    component: fc
    props:
      region: ${vars.region}
      service:
        name: yanjian-web
      function:
        name: next-fn
        runtime: custom
        codeUri: ./
        timeout: 60
        customRuntimeConfig:
          command: ["npm", "start"]
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods: ["GET", "POST", "PUT", "DELETE"]
